name: Release

# Publishes a GitHub Release whenever a version tag is pushed, with one ZIP per
# plugin bundle attached. The archives are built here rather than by hand,
# because PrusaSlicer requires the bundle's files at the archive root -- zipping
# the bundle directory instead produces "cannot load manifest.json" on install.

on:
  push:
    tags:
      - "v*"
  # Also runnable by hand, which is how a release is cut when pushing a tag
  # is inconvenient. gh creates the tag at the checked-out commit.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="$GITHUB_REF_NAME"
          fi
          case "$version" in
            v[0-9]*) ;;
            *) echo "::error::Version must look like v1.2.3, got '$version'"; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $version"

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Check plugin syntax
        run: luac5.4 -p plugins/*/*.lua

      - name: Build bundle archives
        run: |
          mkdir -p dist
          for bundle in plugins/*/; do
            id=$(basename "$bundle")
            # Zip from inside the bundle so entries are stored flat, with no
            # directory prefix. -X drops platform-specific extra fields.
            (cd "$bundle" && zip -X -r "$GITHUB_WORKSPACE/dist/$id.zip" manifest.json *.lua)
          done

      - name: Verify archive layout
        run: |
          for archive in dist/*.zip; do
            entries=$(unzip -Z1 "$archive")
            if ! printf '%s\n' "$entries" | grep -qx 'manifest.json'; then
              echo "::error::$archive has no manifest.json at its root"
              exit 1
            fi
            if printf '%s\n' "$entries" | grep -q '/'; then
              echo "::error::$archive contains directory entries; bundles must be flat"
              printf '%s\n' "$entries"
              exit 1
            fi
            echo "$archive:"
            printf '  %s\n' $entries
          done

      - name: Compare manifest versions against the tag
        run: |
          tag_version="${VERSION#v}"
          for bundle in plugins/*/; do
            id=$(basename "$bundle")
            manifest_version=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$bundle/manifest.json")
            if [ "$manifest_version" != "$tag_version" ]; then
              # A warning, not an error: once the repository holds several
              # bundles they will not all share one version.
              echo "::warning::$id declares version $manifest_version but the tag is $tag_version"
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Download the bundle below and unpack it into your PrusaSlicer data directory,
          under `lua/<bundle-id>/`, then restart the slicer.

          Do not use the slicer's ZIP import: these archives are unsigned, and that path
          requires both a signature and the author's public key already present on your
          machine. Bundles loaded from the `lua` directory are not verified, so unpacking
          works without either.

          Installation paths and troubleshooting are in
          [docs/installation.md](../blob/main/docs/installation.md).

          These plugins are drafts: they pass syntax checks but are not yet verified
          against a running slicer. Please report anything that breaks.
          NOTES
          gh release create "$VERSION" dist/*.zip \
            --title "$VERSION" \
            --notes-file notes.md
